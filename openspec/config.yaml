schema: spec-driven

context: |
  Sonexa 是以音乐收藏为中心的桌面应用，不依赖本地音频文件。
  技术栈：Wails v2、Go、Vue 3、TypeScript、Tailwind CSS v4、Volt、Lucide Icons、Pinia。
  Volt 使用本地组件源码，基于 unstyled PrimeVue。
  当前行为见 openspec/specs/，架构见 openspec/design.md。
  现存问题和未完成目标见 openspec/known-gaps.md；归档仅供历史查询。
  文档使用常见中文，规则集中定义，删除已失效的说明，不把未完成目标写成已实现。
  提交信息使用中文，说明修改范围、原因、验证结果与剩余风险。
